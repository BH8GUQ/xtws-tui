[package]
name = "xtws-tui"
version = "0.1.0"
edition = "2024"
description = "A Rust TUI terminal monitor for FT8/FT4 weak-signal decodes and QSO tracking"
repository = "https://github.com/bh8guq/xtws-tui"
homepage = "https://github.com/bh8guq/xtws-tui"
license = "GPL-3.0-only"

[dependencies]
mfsk-core = { version = "0.14", features = ["ft8", "ft4"] }
cpal = "0.18.2"
ringbuf = "0.6.0"
chrono = "0.4.45"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
log = "0.4"
env_logger = "0.11"
ratatui = "0.30"
crossterm = "0.29"