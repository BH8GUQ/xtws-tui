[user]
call = "ID1OT"
grid = "PM95"
freq_mhz = 21.074

[device.radio]
duplex = false
protocol = "ft8"

[ui]
refresh_ms = 100
left_percent = 55
show_rx = true
show_tx = true
show_evt = false
hide_worked = false
color_new_call = "green"
color_new_grid = "purple"
color_new_dxcc = "red"
color_working = "orange"
color_worked = "gray"

[qso]
auto_reply_cq = true
reply_b4 = false
max_retries = 5
cq_slot = 0
idle_slots_before_cq = 0
auto_cq_max_retries = 10

[log.run]
dir = "logs/run"
keep_days = 30
mem_lines = 1000

[log.qso]
dir = "logs/qso"
keep_days = 3650

[log.worked]
calls_path = "logs/worked_calls.txt"
grids_path = "logs/worked_grids.txt"

[build.ft8]
sample_rate = 12000
tx_freq = 1500.0
tx_amp = 20000
start_offset = 0.5

[build.ft4]
sample_rate = 12000
tx_freq = 1500.0
tx_amp = 20000
start_offset = 0.5

[decode.ft8]
freq_min = 100.0
freq_max = 3000.0

[decode.ft4]
freq_min = 100.0
freq_max = 3000.0

